<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sexta-feira</title>
<style>
  html, body { margin: 0; height: 100%; background: #02060d; color: #9eeaff; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; align-content: center; gap: 22px; }
  .ring { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(54,214,255,.25);
          border-top-color: #36d6ff; animation: spin 1.1s linear infinite; box-shadow: 0 0 40px rgba(54,214,255,.25); }
  p { letter-spacing: .3em; font-size: 14px; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="ring"></div>
  <p>INICIALIZANDO SISTEMAS LOCAIS</p>
</body>
</html>
